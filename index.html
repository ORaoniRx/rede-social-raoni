<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mural Anônimo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #121214;
      color: #e1e1e6;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 20px;
      color: #ffffff;
      font-size: 1.8rem;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
    }

    /* Top Actions */
    .acoes-topo {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      width: 100%;
      max-width: 450px;
    }

    .btn-acao {
      flex: 1;
      border: 1px solid #00ff88;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      color: #00ff88;
      background: rgba(0, 255, 136, 0.05);
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.1);
    }

    .btn-acao:hover {
      background: #00ff88;
      color: #121214;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
    }

    .btn-acao:active {
      transform: scale(0.97);
    }

    /* Form Containers */
    #form-container,
    #search-container {
      width: 100%;
      max-width: 450px;
      margin-bottom: 24px;
    }

    .form-card {
      background: rgba(32, 32, 36, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 136, 0.3);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .form-card input,
    .form-card textarea {
      width: 100%;
      padding: 10px 14px;
      background: rgba(18, 18, 20, 0.8);
      border: 1px solid #29292e;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-card input:focus,
    .form-card textarea:focus {
      border-color: #00ff88;
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.2);
    }

    .form-card textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-acoes {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .btn-cancelar {
      background: transparent;
      border: 1px solid #323238;
      color: #a8a8b3;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-cancelar:hover {
      background: #29292e;
      color: #ffffff;
    }

    .btn-enviar {
      background: #00ff88;
      color: #121214;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: box-shadow 0.2s ease;
    }

    .btn-enviar:hover {
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
    }

    /* Active Filter Indicator */
    .filtro-ativo {
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid #00ff88;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 450px;
      font-weight: 600;
      color: #00ff88;
    }

    .btn-limpar-filtro {
      background: transparent;
      border: none;
      color: #ff4d4d;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* Feed Layout */
    #feed {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 450px;
    }

    /* Post Card */
    .card {
      background: rgba(32, 32, 36, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      transition: border-color 0.2s ease;
    }

    .card:hover {
      border-color: rgba(0, 255, 136, 0.3);
    }

    .box {
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 12px;
      background: rgba(18, 18, 20, 0.4);
    }

    .emoji-box {
      font-size: 2.5rem;
      text-align: center;
      background: rgba(0, 255, 136, 0.03);
      border-color: rgba(0, 255, 136, 0.15);
    }

    .texto-box {
      font-size: 1rem;
      color: #e1e1e6;
      line-height: 1.5;
    }

    .hashtags-box {
      color: #00ff88;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .likes-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .btn-like {
      background: rgba(0, 255, 136, 0.1);
      color: #00ff88;
      border: 1px solid #00ff88;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .btn-like:hover:not(:disabled) {
      background: #00ff88;
      color: #121214;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
    }

    .btn-like:disabled {
      background: transparent;
      border-color: #323238;
      color: #7c7c8a;
      cursor: not-allowed;
    }

    /* Comments Section */
    .comentarios-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .comentarios-box strong {
      font-size: 0.85rem;
      color: #a8a8b3;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .lista-comentarios {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lista-comentarios li {
      background: rgba(18, 18, 20, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      color: #c4c4cc;
    }

    .form-comentario {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .form-comentario input {
      flex: 1;
      padding: 8px 12px;
      background: rgba(18, 18, 20, 0.8);
      border: 1px solid #29292e;
      border-radius: 6px;
      color: #ffffff;
      font-size: 0.88rem;
      outline: none;
    }

    .form-comentario input:focus {
      border-color: #00ff88;
    }

    .form-comentario button {
      padding: 8px 14px;
      border: none;
      background: #29292e;
      color: #ffffff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .form-comentario button:hover {
      background: #00ff88;
      color: #121214;
    }
  </style>

  <!-- SDK oficial do Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <h1>Mural Anônimo 💌</h1>

  <div class="acoes-topo">
    <button class="btn-acao btn-novo-post" onclick="toggleFormulario()">+ Nova Postagem</button>
    <button class="btn-acao btn-pesquisar" onclick="togglePesquisa()">🔍 Pesquisar</button>
  </div>

  <div id="form-container"></div>
  <div id="search-container"></div>
  <div id="filtro-container"></div>

  <div id="feed">Carregando postagens...</div>

  <script>
    const SUPABASE_URL = "https://asphjuhvyhcroinvrrdf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_KKbtMNFo2prwYTotREKGMA_NVVQZpNB";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const feedEl = document.getElementById("feed");
    const formContainerEl = document.getElementById("form-container");
    const searchContainerEl = document.getElementById("search-container");
    const filtroContainerEl = document.getElementById("filtro-container");

    let hashtagAtual = null;

    // --- MÉTODOS DE CONTROLE DO LOCALSTORAGE ---
    function getCurtidasLocais() {
      const curtidas = localStorage.getItem("curtidas_mural");
      return curtidas ? JSON.parse(curtidas) : [];
    }

    function salvarCurtidaLocal(id) {
      const curtidas = getCurtidasLocais();
      if (!curtidas.includes(id)) {
        curtidas.push(id);
        localStorage.setItem("curtidas_mural", JSON.stringify(curtidas));
      }
    }

    // Alterna o formulário de criação
    function toggleFormulario() {
      searchContainerEl.innerHTML = "";
      if (formContainerEl.innerHTML !== "") {
        formContainerEl.innerHTML = "";
        return;
      }

      formContainerEl.innerHTML = `
        <form class="form-card" onsubmit="criarPostagem(event)">
          <input type="text" id="input-emoji" placeholder="Emoji (ex: 😍, 🚀, 🤡)" maxlength="50" required />
          <textarea id="input-texto" placeholder="O que você está pensando?" required></textarea>
          <input type="text" id="input-hashtags" placeholder="Hashtags separadas por espaço (ex: #dev #supabase)" />
          
          <div class="form-acoes">
            <button type="button" class="btn-cancelar" onclick="toggleFormulario()">Cancelar</button>
            <button type="submit" class="btn-enviar">Publicar</button>
          </div>
        </form>
      `;
    }

    // Alterna o formulário de pesquisa
    function togglePesquisa() {
      formContainerEl.innerHTML = "";
      if (searchContainerEl.innerHTML !== "") {
        searchContainerEl.innerHTML = "";
        return;
      }

      searchContainerEl.innerHTML = `
        <form class="form-card" onsubmit="executarPesquisa(event)">
          <input type="text" id="input-busca-hashtag" placeholder="Digite a hashtag (ex: #dev ou dev)" required />
          <div class="form-acoes">
            <button type="button" class="btn-cancelar" onclick="togglePesquisa()">Cancelar</button>
            <button type="submit" class="btn-enviar">Buscar</button>
          </div>
        </form>
      `;
    }

    // Executa o filtro de busca
    function executarPesquisa(event) {
      event.preventDefault();
      let term = document.getElementById("input-busca-hashtag").value.trim();

      if (!term.startsWith('#')) {
        term = '#' + term;
      }

      hashtagAtual = term;
      searchContainerEl.innerHTML = "";
      carregarPostagens();
    }

    // Limpa a busca e volta ao feed normal
    function limparFiltro() {
      hashtagAtual = null;
      filtroContainerEl.innerHTML = "";
      carregarPostagens();
    }

    // Envia o novo post para o Supabase
    async function criarPostagem(event) {
      event.preventDefault();

      const emoji = document.getElementById("input-emoji").value.trim();
      const texto = document.getElementById("input-texto").value.trim();
      const hashtagsRaw = document.getElementById("input-hashtags").value.trim();

      const hashtags = hashtagsRaw
        ? hashtagsRaw.split(" ")
          .filter(h => h.length > 0)
          .map(h => h.startsWith('#') ? h : '#' + h)
        : [];

      const { error } = await supabaseClient
        .from("postagens")
        .insert([{ emoji, texto, hashtags }]);

      if (error) {
        alert("Erro ao criar postagem!");
        console.error(error);
        return;
      }

      formContainerEl.innerHTML = "";
      carregarPostagens();
    }

    // Busca os posts no banco (com ou sem filtro)
    async function carregarPostagens() {
      let query = supabaseClient
        .from("postagens")
        .select("*")
        .order("created_at", { ascending: false });

      if (hashtagAtual) {
        query = query.contains("hashtags", [hashtagAtual]);

        filtroContainerEl.innerHTML = `
          <div class="filtro-ativo">
            <span>Filtrando por: ${hashtagAtual}</span>
            <button class="btn-limpar-filtro" onclick="limparFiltro()">Limpar ✖</button>
          </div>
        `;
      } else {
        filtroContainerEl.innerHTML = "";
      }

      const { data: postagens, error } = await query;

      if (error) {
        feedEl.innerHTML = "<p>Erro ao carregar postagens.</p>";
        console.error(error);
        return;
      }

      if (postagens.length === 0) {
        feedEl.innerHTML = "<p style='color: #7c7c8a; text-align: center;'>Nenhuma postagem encontrada com esses critérios.</p>";
        return;
      }

      // Obtém as curtidas salvas nesta máquina
      const curtidasLocais = getCurtidasLocais();

      feedEl.innerHTML = "";
      postagens.forEach(post => {
        const card = document.createElement("div");
        card.className = "card";

        const hashtagsTexto = post.hashtags ? post.hashtags.join(" ") : "";
        const listaComentariosHTML = (post.comentarios || [])
          .map(c => `<li>${c}</li>`)
          .join("");

        // Checa se o post atual já foi curtido localmente
        const jaCurtido = curtidasLocais.includes(post.id);

        card.innerHTML = `
          <div class="box emoji-box">${post.emoji || '❤️'}</div>
          <div class="box texto-box">${post.texto}</div>
          <div class="box hashtags-box">${hashtagsTexto}</div>
          
          <div class="box likes-box">
            <span>❤️ ${post.likes || 0} Likes</span>
            <button 
              class="btn-like" 
              onclick="curtirPost(${post.id}, ${post.likes || 0})"
              ${jaCurtido ? 'disabled' : ''}
            >
              ${jaCurtido ? 'Curtido' : 'Curtir'}
            </button>
          </div>

          <div class="box comentarios-box">
            <strong>Comentários</strong>
            <ul class="lista-comentarios">${listaComentariosHTML}</ul>
            <form class="form-comentario" onsubmit="adicionarComentario(event, ${post.id}, ${JSON.stringify(post.comentarios || []).replace(/"/g, '&quot;')})">
              <input type="text" placeholder="Comentar..." required />
              <button type="submit">Enviar</button>
            </form>
          </div>
        `;

        feedEl.appendChild(card);
      });
    }

    async function curtirPost(id, likesAtuais) {
      const curtidasLocais = getCurtidasLocais();
      if (curtidasLocais.includes(id)) return;

      const { error } = await supabaseClient
        .from("postagens")
        .update({ likes: likesAtuais + 1 })
        .eq("id", id);

      if (!error) {
        salvarCurtidaLocal(id);
        carregarPostagens();
      }
    }

    async function adicionarComentario(event, id, comentariosAtuais) {
      event.preventDefault();
      const input = event.target.querySelector("input");
      const novoComentario = input.value.trim();

      if (!novoComentario) return;

      const { error } = await supabaseClient
        .from("postagens")
        .update({ comentarios: [...comentariosAtuais, novoComentario] })
        .eq("id", id);

      if (!error) carregarPostagens();
    }

    carregarPostagens();
  </script>
</body>

</html>
